name: Secret & Webhook Scan

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --upgrade pip
      - name: Run secret scan
        id: scan
        continue-on-error: true
        run: |
          python scripts/check_secrets.py > scan.out 2>&1 || true
      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-output
          path: scan.out
      - name: Comment on PR with scan results
        if: ${{ github.event_name == 'pull_request' && steps.scan.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('scan.out') ? fs.readFileSync('scan.out','utf8') : 'No output';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Secret scan detected potential secrets:\n\n\`\`\`\n${body}\n\`\`\``
            });
      - name: Fail if secrets found (push/PR)
        if: steps.scan.outcome == 'failure'
        run: |
          echo 'Secret scan failed; aborting.'
          exit 1
