# Zero-cost Render staging Blueprint.
# Free web + free Postgres only; no paid worker, Redis, or persistent disk.
services:
  - type: web
    name: social-campaign-publisher-staging
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      # Without Redis/RQ, retries use the in-process APScheduler.
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: social-campaign-publisher-staging-db
          property: connectionString
      - key: APP_API_KEY
        generateValue: true
      - fromGroup: social-campaign-publisher-staging-secrets

databases:
  - name: social-campaign-publisher-staging-db
    plan: free
    region: frankfurt
    databaseName: social_campaign_publisher
    user: scp_staging

envVarGroups:
  - name: social-campaign-publisher-staging-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
