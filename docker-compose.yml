version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: scp_redis
    ports:
      - "6379:6379"

  app:
    image: python:3.11-slim
    container_name: scp_app
    volumes:
      - ./:/app:cached
    working_dir: /app
    environment:
      - DATABASE_URL=sqlite:///./dev.db
      - SECRET_KEY=replace-me
      - WEBHOOK_SECRET=replace-me
      - REDIS_URL=redis://redis:6379/0
    command: bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  rq_worker:
    image: python:3.11-slim
    container_name: scp_rq_worker
    volumes:
      - ./:/app:cached
    working_dir: /app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./dev.db
      - SECRET_KEY=replace-me
      - WEBHOOK_SECRET=replace-me
    command: bash -c "pip install -r requirements.txt && rq worker publish-retries"
    depends_on:
      - redis
