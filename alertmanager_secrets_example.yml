global:
  resolve_timeout: 5m

route:
  receiver: 'team-email'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: 'team-email'
    email_configs:
      - to: 'alerts@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'smtp-user'
        auth_identity: 'smtp-user'
        # load smtp password from Docker secret
        auth_password: 'REPLACE_WITH_SECRET_FROM_/run/secrets/smtp_pass'

  - name: 'slack-channel'
    slack_configs:
      - api_url: 'REPLACE_WITH_SECRET_FROM_/run/secrets/slack_webhook'
        channel: '#alerts'
        send_resolved: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Example: create secrets locally (DO NOT commit secrets):
#   echo -n "https://hooks.slack.com/services/XXX/YYY/ZZZ" | docker secret create slack_webhook -
#   echo -n "smtp-password" | docker secret create smtp_pass -

# When running Alertmanager in Docker Swarm or with docker-compose that supports secrets, the secrets will be available under /run/secrets/<name>.
