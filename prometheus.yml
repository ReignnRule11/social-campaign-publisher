global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/prometheus_alerts.yml"

scrape_configs:
  - job_name: 'social-campaign-publisher'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
    # Optional relabeling or basic auth could go here
